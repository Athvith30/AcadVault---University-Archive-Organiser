{% extends 'base.html' %}{% block content %}<div class="page-heading"><h1>Upload Files</h1><p>Upload course materials to your assigned subject folders.</p></div><section class="panel"><form method="post" action="/upload" enctype="multipart/form-data" class="row g-3"><input type="hidden" name="csrf" value="{{csrf}}"><div class="col-md-7"><label>Choose assigned subject</label><select class="form-select" name="subject_id" id="subject" required>{% for s in subjects %}<option value="{{s.id}}">{{years.get(s.academic_year_id)}} · Sem {{s.semester_no}} · {{s.name}}</option>{% endfor %}</select></div><div class="col-md-5"><label>Destination folder</label><select name="subfolder_name" class="form-select" id="folder" required></select></div><div class="col-md-12"><label>Choose file (up to 25 MB)</label><input class="form-control" type="file" name="file" required accept=".pdf,.docx,.pptx,.xlsx,.csv,.jpg,.jpeg,.png,.gif,.zip"></div><div class="col-md-12"><button class="btn btn-primary" {% if not subjects %}disabled{% endif %}>Upload and Save New Version</button></div></form></section><script>const options={{locations|safe}};let subject=document.getElementById('subject'),folder=document.getElementById('folder');function refresh(){folder.innerHTML='';(options[subject.value]||[]).forEach(x=>{let o=document.createElement('option');o.textContent=x;o.value=x;folder.appendChild(o)})}subject.addEventListener('change',refresh);refresh();</script>{% endblock %}
