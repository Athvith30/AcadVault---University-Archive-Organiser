<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AcadVault - Sign In</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet">
</head>
<body style="display: flex; justify-content: center; align-items: center; min-height: 100vh; background: #f5f7fa;">
  <div class="card shadow-sm" style="width: 100%; max-width: 420px; border: 1px solid #e0e6ed; border-radius: 16px;">
    <div class="card-body p-5">
      <div class="text-center mb-4">
        <h2 style="color: #243e60; font-weight: bold;">AcadVault</h2>
        <p style="color: #6c7787;">Sign in to your account</p>
      </div>
      <form method="post" action="{{ url_for('login') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="mb-3">
          <label class="form-label" for="email">Email</label>
          <input class="form-control" id="email" name="email" type="email" required autofocus>
        </div>
        <div class="mb-3">
          <label class="form-label" for="password">Password</label>
          <input class="form-control" id="password" name="password" type="password" required>
        </div>
        <button class="btn btn-primary w-100" style="padding: 12px;">Sign In</button>
      </form>
      <hr style="border-color: #e0e6ed; margin: 24px 0;">
      <small class="text-muted d-block text-center">Sample accounts:<br>
        admin@college.com / admin123<br>
        alice@college.com / alice123<br>
        bob@college.com / bob123
      </small>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body></html>
